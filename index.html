n{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:800;color:var(--primary)}.search{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:9px;display:flex;align-items:center;gap:6px}.search input{border:0;outline:0;width:100%;font-size:13px}.filters{display:flex;gap:6px;overflow:auto;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 11px;font-size:10px;font-weight:800}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}.date{font-size:10px;font-weight:850;color:var(--muted);display:flex;justify-content:space-between;margin:16px 3px 7px}.tx{padding:0}.tx-main{display:flex;align-items:center;gap:9px;padding:13px;border-bottom:1px solid var(--line)}.tx-actions{display:flex;gap:5px;justify-content:flex-end;margin-top:4px}.tx-main{min-width:0}.tx-main>div:nth-child(2){min-width:0}.tiny{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 7px;font-size:9px}.form-card{padding:15px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#edf2f7;border-radius:13px;padding:4px}.tab{border:0;background:transparent;border-radius:10px;padding:10px 3px;font-size:10px;font-weight:850}.tab.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06)}.amount-input{width:100%;border:0;outline:0;text-align:center;font-size:38px;font-weight:900;padding:23px 0;color:var(--ink)}label{display:block;font-size:10px;color:var(--muted);font-weight:800;margin:11px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font-size:13px;color:var(--ink);outline:0}textarea{min-height:68px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#7aa9d5;box-shadow:0 0 0 3px rgba(25,118,210,.08)}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,var(--ac 1.5}.badge{display:inline-block;background:#ecfdf5;color:#0f766e;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:800;margin:9px 0}.auth-actions{display:flex;gap:7px;margin-top:11px}.auth-actions button{flex:1}.secondary{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;font-size:11px;font-weight:800;color:var(--primary)}.status{font-size:11px;color:var(--muted);margin-top:7px}.warning{font-size:10px;color:#8a5a00;margin-top:9px}.hidden{display:none!important}.syncing .dot{background:#f3a52f}.success .dot{background:var(--green)}

<body>
<div class="app">
<header class="top" id="topbar" style="display:none"><div class="toprow"><div><div class="brand">Money Book</div><div class="sub">Your money, clearly tracked.</div></div><div class="top-actions"><button class="sync" id="syncBtn"><span class="dot"></span><span id="syncText">Sync</span></button><div class="avatar">K</div></div></div><div id="cloudStatus" class="cloud-status"></div></header>
<div id="auth" class="auth-wrap"><div id="signedOutView" class="authbox"><h2>Welcome to Money Book</h2><div class="auth-intro">Track expenses, income and investments securely across your devices.</div><span class="badge">☁ Private cloud sync</span><div id="authMessage" class="status">Sign in or create an account to continue.</div><label>Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="At least 6 characters"><div class="auth-actions"><button class="primary" id="loginBtn">Sign in</button><button class="secondary" id="signupBtn">Create account</button></div><div class="warning">Your financial data is private to your signed-in account.</div></div><div id="signedInView" class="authbox hidden"><div class="row"><div><b>Cloud sync</b><div id="authStatus" class="status"></div></div><button class="secondary" id="logoutBtn">Sign out</button></div></div></div>

<script>
const SUPABASE_URL="https://zweveffvpqajqrdsnbuu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_KRP_UR66XxeOYs6UAr5Rnw_fQqRMC6n";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const APP="et7", BUD="et7budget", INC="et7income";
const expenseCats=["Food","Groceries","Transport","Shopping","Bills","Health","Entertainment","Travel","Education","Other"];
const invCats=["Mutual Funds","Stocks","SIP","FD","Gold","PPF","NPS","Other Investment"];
const incomeCats=["Salary","Bonus","Interest","Dividend","Other Income"];
const accounts=["UPI","Credit Card","Debit Card","Cash","Bank Transfer","Investment Account"];
let cloudUser=null,tx=[],editing=null,homeMonth=null;
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const monthKey=d=>(d||"").slice(0,7);
const currentMonth=()=>new Date().toISOString().slice(0,7);
function keyForUser(){return cloudUser?`et7_user_${cloudUser.id}`:APP}
function loadLocal(){try{tx=JSON.parse(localStorage.getItem(keyForUser())||"[]")}catch{tx=[]}}
function persist(){localStorage.setItem(keyForUser(),JSON.stringify(tx))}
function adoptLegacyIfNeeded(){if(!cloudUser)return;const key=keyForUser();if(!localStorage.getItem(key)&&!localStorage.getItem(`et7_owner_${cloudUser.id}`)){const legacy=localStorage.getItem(APP);const owner=localStorage.getItem("et7Owner");if(legacy&&(!owner||owner===cloudUser.id)){localStorage.setItem(key,legacy)}localStorage.setItem(`et7_owner_${cloudUser.id}`,"1")}loadLocal()}
function typeCats(type){return type==="Investment"?invCats:type==="Income"?incomeCats:expenseCats}
function txRow(x){const cls=x.type.toLowerCase();return `<div class="tx-main"><div class="ico">${x.type==="Income"?"↗":x.type==="Investment"?"📈":"₹"}</div><div class="grow"><div class="name">${esc(x.merchant||"Unnamed")}</div><div class="meta">${esc(x.category)} • ${esc(x.payment)} • ${x.date}</div></div><div class="money ${cls}">${x.type==="Income"?"+":"−"}${money(x.amount)}</div></div>`}
function nav(){const n=document.getElementById("nav");if(!cloudUser){n.innerHTML="";n.style.display="none";return}n.style.display="flex"}
function show(id){if(!cloudUser)return;document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===id));location.hash=id;renderPage(id)}
function render(){nav();if(!cloudUser){document.getElementById("topbar").style.display="none";document.getElementById("appMain").classList.add("hidden");return}document.getElementById("topbar").style.display="block";document.getElementById("appMain").classList.remove("hidden");const id=location.hash.slice(1)||"home";document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===id));renderPage(id)}
function renderPage(id){if(id==="home")renderHome();if(id==="add")renderAdd();if(id==="transactions")renderTx();if(id==="insights")renderInsights();if(id==="budget")renderBudget();if(id==="more")renderMore()}
function renderHome(){const m=homeMonth||currentMonth(),rows=tx.filter(x=>monthKey(x.date)===m),exp=rows.filter(x=>x.type==="Expense").reduce((a,x)=>a+Number(x.amount),0),inv=rows.filter(x=>x.type==="Investment").reduce((a,x)=>a+Number(x.amount),0),inc=rows.filter(x=>x.type==="Income").reduce((a,x)=>a+Number(x.amount),0),days=m===currentMonth()?new Date().getDate():new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate(),cats={};rows.filter(x=>x.type==="Expense").forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);document.getElementById("home").innerHTML=`<div class="hero"><div class="eyebrow">Net cash flow • ${m}</div><div class="balance">${money(inc-exp-inv)}</div><div class="hero-grid"><div class="hero-stat">Income<b>${money(inc)}</b></div><div class="hero-stat">Expenses<b>${money(exp)}</b></div><div class="hero-stat">Invested<b>${money(inv)}</b></div></div></div><div class="section"><h3>This month</h3><input id="homeMonth" type="month" value="${m}" style="width:auto;padding:7px 9px;font-size:10px"></div><div class="stats"><div class="card stat"><span>Total outflow</span><b>${money(exp+inv)}</b></div><div class="card stat"><span>Daily average</span><b>${money(exp/days)}</b></div><div class="card stat"><span>Net</span><b class="${inc-exp-inv>=0?"income":"expense"}">${money(inc-exp-inv)}</b></div></div><div class="section"><h3>Cash flow</h3><button onclick="show('insights')">View insights</button></div><div class="card chart"><svg viewBox="0 0 360 118" preserveAspectRatio="none"><path d="M0 90 C35 78 45 92 70 66 S110 75 130 54 S160 79 185 48 S215 60 235 39 S265 54 285 27 S320 46 360 16" fill="none" stroke="#14966a" stroke-width="4"/><path d="M0 102 C30 96 55 78 75 94 S110 84 130 97 S160 70 180 88 S215 66 240 80 S275 60 300 72 S330 55 360 64" fill="none" stroke="#e95353" stroke-width="4"/></svg><div class="chart-note"><span>Income</span><span>Expenses</span></div></div><div class="section"><h3>Top categories</h3><button onclick="show('insights')">View all</button></div><div class="card list">${top.length?top.map(([k,v])=>`<div class="row"><div class="ico">${k==="Food"?"🍽️":k==="Groceries"?"🛒":k==="Transport"?"🚕":k==="Shopping"?"🛍️":"•"}</div><div class="grow"><div class="name">${esc(k)}</div><div class="meta">${Math.round(v/Math.max(exp,1)*100)}% of expenses</div></div><div class="money">${money(v)}</div></div>`).join(""):"<div class=empty>No expenses this month</div>"}</div><div class="section"><h3>Recent transactions</h3><button onclick="show('transactions')">View all</button></div><div class="card list">${tx.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,5).map(txRow).join("")||"<div class=empty>No transactions yet</div>"}</div>`;document.getElementById("homeMonth").onchange=e=>{homeMonth=e.target.value;renderHome()}}
function renderAdd(){const type=editing?editing.type:(window.newType||"Expense"),cats=typeCats(type);document.getElementById("add").innerHTML=`<div class="titlebar"><h2>${editing?"Edit":"Add"} transaction</h2><button class="btn" onclick="show('home')">Close</button></div><div class="card form-card"><div class="tabs">${["Expense","Income","Investment"].map(x=>`<button class="tab ${x===type?"active":""}" data-type="${x}">${x}</button>`).join("")}</div><input id="aAmount" class="amount-input" type="number" inputmode="decimal" value="${editing?.amount||""}" placeholder="₹ 0"><label>Date</label><input id="aDate" type="date" value="${editing?.date||new Date().toISOString().slice(0,10)}"><label>${type==="Income"?"Source":"Merchant / Description"}</label><input id="aMerchant" value="${esc(editing?.merchant||"")}" placeholder="e.g. Swiggy / Salary"><label>Category</label><select id="aCat">${cats.map(x=>`<option ${x===editing?.category?"selected":""}>${x}</option>`).join("")}</select><label>Payment / Account</label><select id="aPay">${accounts.map(x=>`<option ${x===editing?.payment?"selected":""}>${x}</option>`).join("")}</select><label>Notes</label><textarea id="aNotes" placeholder="Optional">${esc(editing?.notes||"")}</textarea><button class="primary" id="saveBtn">${editing?"Update":"Save"} transaction</button></div>`;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(editing)editing={...editing,type:b.dataset.type};else window.newType=b.dataset.type;renderAdd()});document.getElementById("saveBtn").onclick=async()=>{const wasEditing=!!editing;const obj={id:editing?.id||crypto.randomUUID(),date:document.getElementById("aDate").value,type:type,merchant:document.getElementById("aMerchant").value.trim()||"Unnamed",category:document.getElementById("aCat").value,payment:document.getElementById("aPay").value,amount:Number(document.getElementById("aAmount").value),notes:document.getElementById("aNotes").value.trim(),created:editing?.created||Date.now(),modified:Date.now()};if(!obj.date||!Number.isFinite(obj.amount)||obj.amount<=0)return alert("Enter a valid date and amount.");const oldTx=tx.slice();if(wasEditing)tx=tx.map(x=>x.id===obj.id?obj:x);else tx.push(obj);persist();const btn=document.getElementById("saveBtn");btn.disabled=true;btn.textContent=wasEditing?"Updating…":"Saving…";try{await saveToCloud(obj);editing=null;window.newType=null;renderTx();show("transactions");}catch(e){tx=oldTx;persist();btn.disabled=false;btn.textContent=wasEditing?"Update transaction":"Save transaction";alert("Could not save to cloud: "+e.message)}}}
function renderTx(){const q=window.txQ||"",tf=window.txF||"All",cf=window.txC||"All";let rows=tx.filter(x=>(tf==="All"||x.type===tf)&&(cf==="All"||x.category===cf)&&(!q||[x.merchant,x.category,x.notes,x.payment].join(" ").toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);const cats=[...new Set(tx.map(x=>x.category))].sort();document.getElementById("transactions").innerHTML=`<div class="titlebar"><h2>Transactions</h2><button class="btn" onclick="show('add')">＋ Add</button></div><div class="search">⌕<input id="txQ" value="${esc(q)}" placeholder="Search transactions"></div><div class="filters">${["All","Expense","Income","Investment"].map(x=>`<button class="chip ${tf===x?"active":""}" data-f="${x}">${x}</button>`).join("")}</div><div class="card" style="margin-top:11px">${rows.length?rows.map(x=>`<div class="tx"><div class="tx-main"><div class="ico">${x.type==="Income"?"↗":x.type==="Investment"?"📈":"₹"}</div><div class="grow"><div class="name">${esc(x.merchant||"Unnamed")}</div><div class="meta">${esc(x.category)} • ${esc(x.payment)} • ${x.date}</div></div><div style="text-align:right"><div class="money ${x.type.toLowerCase()}">${x.type==="Income"?"+":"−"}${money(x.amount)}</div><div class="tx-actions"><button class="tiny" onclick="editTx('${x.id}')">Edit</button><button class="tiny" onclick="delTx('${x.id}')">Delete</button></div></div></div></div>`).join(""):"<div class=empty>No matching transactions</div>"}</div>`;document.getElementById("txQ").oninput=e=>{window.txQ=e.target.value;renderTx()};document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{window.txF=b.dataset.f;renderTx()})}
function renderInsights(){const m=homeMonth||currentMonth(),rows=tx.filter(x=>monthKey(x.date)===m),exp=rows.filter(x=>x.type==="Expense").reduce((a,x)=>a+Number(x.amount),0),inc=rows.filter(x=>x.type==="Income").reduce((a,x)=>a+Number(x.amount),0),inv=rows.filter(x=>x.type==="Investment").reduce((a,x)=>a+Number(x.amount),0),cats={};rows.filter(x=>x.type==="Expense").forEach(x=>cats[x.category]=(cats[x.category]||0)+Number(x.amount));const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]);document.getElementById("insights").innerHTML=`<div class="titlebar"><h2>Insights</h2><input id="insMonth" type="month" value="${m}" style="width:auto;padding:7px 9px;font-size:10px"></div><div class="card" style="padding:16px"><div class="section" style="margin-top:0"><h3>Spending overview</h3><span class="muted">${m}</span></div><div class="donut"></div>${top.slice(0,6).map(([k,v])=>`<div class="legend-row"><span class="legend-dot"></span><div class="grow">${esc(k)}</div><b>${Math.round(v/Math.max(exp,1)*100)}%</b><span class="muted">${money(v)}</span></div>`).join("")||"<div class=empty>No expense data</div>"}</div><div class="section"><h3>Money health</h3></div><div class="insight-grid"><div class="card mini"><span>Income</span><b class="income">${money(inc)}</b></div><div class="card mini"><span>Expenses</span><b class="expense">${money(exp)}</b></div><div class="card mini"><span>Investments</span><b class="investment">${money(inv)}</b></div><div class="card mini"><span>Savings rate</span><b>${inc?((inc-exp-inv)/inc*100).toFixed(1):"0.0"}%</b></div></div>`;document.getElementById("insMonth").onchange=e=>{homeMonth=e.target.value;renderInsights()}}
function renderBudget(){const b=JSON.parse(localStorage.getItem(`${BUD}_${cloudUser.id}`)||"{}"),total=Number(b.total||0),spent=tx.filter(x=>x.type==="Expense"&&monthKey(x.date)===(homeMonth||currentMonth())).reduce((a,x)=>a+Number(x.amount),0),pct=total?Math.min(100,spent/total*100):0;document.getElementById("budget").innerHTML=`<div class="titlebar"><h2>Budget</h2><button class="btn" id="saveBudget">Save</button></div><div class="card budget-total"><div class="muted">Monthly expense budget</div><div class="budget-num">${money(spent)} <span class="muted">of ${money(total)}</span></div><div class="barbg"><div class="bar" style="width:${pct}%"></div></div><div class="barlabel"><span>${pct.toFixed(0)}% used</span><span>${money(Math.max(total-spent,0))} left</span></div><label>Budget amount</label><input id="budgetInput" type="number" value="${total||""}" placeholder="60000"></div><div class="section"><h3>Category budgets</h3><span class="muted">Coming next</span></div><div class="card list"><div class="row"><div class="ico">🍽️</div><div class="grow"><div class="name">Food</div><div class="meta">Use category limits to control spending.</div></div>›</div><div class="row"><div class="ico">🛍️</div><div class="grow"><div class="name">Shopping</div><div class="meta">Set category budgets in the next release.</div></div>›</div><div class="row"><div class="ico">🚕</div><div class="grow"><div class="name">Transport</div><div class="meta">Set category budgets in the next release.</div></div>›</div></div>`;document.getElementById("saveBudget").onclick=()=>{localStorage.setItem(`${BUD}_${cloudUser.id}`,JSON.stringify({total:Number(document.getElementById("budgetInput").value||0)}));renderBudget();alert("Budget saved")}}
function renderMore(){document.getElementById("more").innerHTML=`<div class="profile"><div class="avatar">K</div><div><b>${esc(cloudUser.email||"Account")}</b><div style="font-size:10px;opacity:.8;margin-top:3px">Private cloud account</div></div></div><div class="section"><h3>Manage</h3></div><div class="card settings"><div class="row"><div class="setting-icon">🏦</div><div class="grow"><div class="name">Accounts & wallets</div><div class="meta">Banks, cards and cash</div></div><span class="arrow">›</span></div><div class="row"><div class="setting-icon">🔄</div><div class="grow"><div class="name">Recurring transactions</div><div class="meta">Bills, salary and SIPs</div></div><span class="arrow">›</span></div><div class="row"><div class="setting-icon">📁</div><div class="grow"><div class="name">Categories</div><div class="meta">Expense, income and investment</div></div><span class="arrow">›</span></div></div><div class="section"><h3>Data</h3></div><div class="card settings"><div class="row" onclick="syncNow()"><div class="setting-icon">☁️</div><div class="grow"><div class="name">Sync with cloud</div><div class="meta">Save and restore your transactions</div></div><span class="arrow">›</span></div><div class="row" onclick="exportCSV()"><div class="setting-icon">↗️</div><div class="grow"><div class="name">Export CSV</div><div class="meta">Download a portable backup</div></div><span class="arrow">›</span></div><div class="row" onclick="numbersExport()"><div class="setting-icon"></div><div class="grow"><div class="name">Apple Numbers</div><div class="meta">Send the latest transaction</div></div><span class="arrow">›</span></div></div>`}
async function refreshSession(){const {data:{session}}=await supabaseClient.auth.getSession();cloudUser=session?.user||null;const so=document.getElementById("signedOutView"),si=document.getElementById("signedInView");if(cloudUser){adoptLegacyIfNeeded();so.classList.add("hidden");si.classList.remove("hidden");document.getElementById("authStatus").textContent=(cloudUser.email||"account")+" • cloud connected";document.getElementById("auth").classList.add("hidden");document.getElementById("topbar").style.display="block";await loadCloudTransactions();render()}else{so.classList.remove("hidden");si.classList.add("hidden");document.getElementById("auth").classList.remove("hidden");document.getElementById("topbar").style.display="none";document.getElementById("appMain").classList.add("hidden");document.getElementById("nav").style.display="none";document.getElementById("nav").innerHTML="";document.getElementById("authMessage").textContent="Sign in or create an account to continue."}}
async function login(){const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value;if(!email||!password)return alert("Enter your email and password.");const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)return alert(error.message);await refreshSession()}
async function signup(){const email=document.getElementById("loginEmail").value.trim(),password=document.getElementById("loginPassword").value;if(!email||!password)return alert("Enter your email and password.");if(password.length<6)return alert("Use a password with at least 6 characters.");const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)return alert(error.message);if(data?.session)await refreshSession();else alert("Account created. Check your email to confirm your account, then sign in.")}
async function logout(){cloudUser=null;document.getElementById("nav").innerHTML="";document.getElementById("nav").style.display="none";document.getElementById("appMain").classList.add("hidden");document.getElementById("topbar").style.display="none";await supabaseClient.auth.signOut();await refreshSession()}
async function loadCloudTransactions(){if(!cloudUser)return;const {data,error}=await supabaseClient.from("transactions").select("*").eq("user_id",cloudUser.id).order("date",{ascending:false});if(error){console.error(error);document.getElementById("cloudStatus").textContent="Cloud error";return}if(data?.length){tx=data.map(x=>({id:x.id,date:x.date,type:x.type,merchant:x.merchant||"",category:x.category,payment:x.payment||"",amount:Number(x.amount),notes:x.notes||"",created:Number(x.created||Date.now()),modified:Number(x.modified||Date.now())}));persist();document.getElementById("cloudStatus").textContent=`☁ Synced • ${tx.length} transactions`}else{loadLocal();document.getElementById("cloudStatus").textContent=tx.length?"☁ Local data ready • tap Sync":"☁ Cloud ready • no transactions"}}
async function saveToCloud(x){if(!cloudUser)return;const {error}=await supabaseClient.from("transactions").upsert({id:x.id,user_id:cloudUser.id,date:x.date,type:x.type,merchant:x.merchant,category:x.category,payment:x.payment,amount:x.amount,notes:x.notes,created:x.created,modified:x.modified},{onConflict:"id"});if(error){console.error(error);document.getElementById("cloudStatus").textContent="Cloud save failed";throw error}document.getElementById("cloudStatus").textContent="☁ Saved to cloud"}
async function syncNow(){if(!cloudUser)return;const btn=document.getElementById("syncBtn"),text=document.getElementById("syncText");btn.classList.add("syncing");text.textContent="Syncing…";try{const {data,error}=await supabaseClient.from("transactions").select("*").eq("user_id",cloudUser.id).order("date",{ascending:false});if(error)throw error;if(data?.length){tx=data.map(x=>({id:x.id,date:x.date,type:x.type,merchant:x.merchant||"",category:x.category,payment:x.payment||"",amount:Number(x.amount),notes:x.notes||"",created:Number(x.created||Date.now()),modified:Number(x.modified||Date.now())}));persist()}else if(tx.length){const rows=tx.map(x=>({id:x.id,user_id:cloudUser.id,date:x.date,type:x.type,merchant:x.merchant,category:x.category,payment:x.payment,amount:x.amount,notes:x.notes,created:x.created,modified:x.modified}));const up=await supabaseClient.from("transactions").upsert(rows,{onConflict:"id"});if(up.error)throw up.error}const {data:check,error:ce}=await supabaseClient.from("transactions").select("id").eq("user_id",cloudUser.id);if(ce)throw ce;document.getElementById("cloudStatus").textContent=`☁ Synced • ${check?.length||0} transactions`;renderPage(location.hash.slice(1)||"home")}catch(e){console.error(e);document.getElementById("cloudStatus").textContent="Sync failed";alert("Cloud sync failed: "+e.message)}finally{btn.classList.remove("syncing");text.textContent="Sync"}}
function editTx(id){const found=tx.find(x=>x.id===id);if(!found)return alert("Transaction not found.");editing={...found};show("add")}
async function delTx(id){if(!confirm("Delete this transaction?"))return;tx=tx.filter(x=>x.id!==id);persist();if(cloudUser){const {error}=await supabaseClient.from("transactions").delete().eq("id",id).eq("user_id",cloudUser.id);if(error){alert("Cloud delete failed: "+error.message);return}}renderTx()}
function exportCSV(){const cols=["id","date","type","merchant","category","payment","amount","notes","created","modified"];const csv=cols.join(",")+"\n"+tx.map(x=>cols.map(c=>`"${String(x[c]??"").replaceAll('"','""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="money-book-backup.csv";a.click();URL.revokeObjectURL(a.href)}
function numbersExport(){const x=tx[tx.length-1];if(!x)return alert("Add a transaction first.");const payload=["id","date","type","merchant","category","payment","amount","notes","created","modified"].map(k=>x[k]??"").join(" | ");location.href="shortcuts://run-shortcut?name=Expense%20to%20Numbers&input="+encodeURIComponent(payload)}
document.getElementById("loginBtn").onclick=login;document.getElementById("signupBtn").onclick=signup;document.getElementById("logoutBtn").onclick=logout;document.getElementById("syncBtn").onclick=syncNow;
supabaseClient.auth.onAuthStateChange(()=>setTimeout(refreshSession,0));window.addEventListener("hashchange",()=>{if(cloudUser)show(location.hash.slice(1)||"home")});refreshSession();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js?v=141").catch(()=>{});
</script></body></html>
